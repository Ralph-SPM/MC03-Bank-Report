<!--
  Stitch Design System Reference
  Extracted from Stitch design output for MC03 RCBC Auto Loan Demo
  Colors: slate-900 (primary header), slate-800, indigo-600 (accent), emerald-600 (success), amber-500 (warning), rose-600 (danger)
  Fonts: Inter (body), JetBrains Mono (data/code)
-->
<div class="stitch-tokens">
  <!-- Primary Header -->
  <header class="bg-slate-900 border-b border-slate-800 text-white"></header>
  <!-- Card Metric -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-4"></div>
  <!-- Primary Button -->
  <button class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-xs"></button>
  <!-- Active Filter Pill -->
  <button class="px-3 py-1.5 rounded-full font-medium bg-slate-900 text-white shadow-xs"></button>
  <!-- Inactive Filter Pill -->
  <button class="px-3 py-1.5 rounded-full font-medium bg-slate-100 text-slate-700 hover:bg-slate-200"></button>
  <!-- Badges -->
  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-indigo-50 text-indigo-700 border border-indigo-200"></span>
  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-amber-50 text-amber-700 border border-amber-200"></span>
  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200"></span>
</div>
